name: pantau-bsc

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install web3
      - run: python snapshot.py 200
      - run: python filter.py
      - run: |
          date -u +"%Y-%m-%dT%H:%MZ" > data/terakhir.txt
          git config user.name "pantau-bot"
          git config user.email "pantau-bot@users.noreply.github.com"
          git add data/ringkasan_harian.csv data/terakhir.txt
          git diff --cached --quiet || git commit -m "snapshot $(cat data/terakhir.txt)"
          git push
